<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>America Turns 250 - Fasano Pool Party</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --navy:#0c1a3c;
    --navy2:#13265a;
    --navy3:#1c3270;
    --red:#cc1f33;
    --cream:#f6efdd;
    --gold:#edb73a;
    --aqua:#27b6c9;
    --ink:#13110d;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
  body{ font-family:"Oswald", sans-serif; background:var(--navy); color:var(--cream); }
  .wrap{ max-width:560px; margin:0 auto; background:var(--navy); overflow:hidden; }

  /* ribbon */
  .ribbon{
    background:var(--red); color:#fff; font-weight:700; font-size:12px;
    letter-spacing:2px; text-transform:uppercase; white-space:nowrap;
    overflow:hidden; padding:7px 0; border-bottom:3px solid var(--gold);
  }
  .ribbon span{ display:inline-block; animation:scroll 18s linear infinite; }
  @keyframes scroll{ from{transform:translateX(0);} to{transform:translateX(-50%);} }

  /* hero */
  .hero{
    position:relative; padding:34px 22px 36px; text-align:center;
    background:
      radial-gradient(circle at 20% 12%, rgba(237,183,58,0.25), transparent 30%),
      radial-gradient(circle at 82% 16%, rgba(39,182,201,0.22), transparent 32%),
      radial-gradient(circle at 50% 95%, rgba(204,31,51,0.30), transparent 45%),
      linear-gradient(180deg, var(--navy2), var(--navy));
    overflow:hidden;
  }
  .hero::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background-image:
      radial-gradient(1.5px 1.5px at 15% 25%, rgba(255,255,255,.5), transparent),
      radial-gradient(1.5px 1.5px at 65% 18%, rgba(255,255,255,.4), transparent),
      radial-gradient(1.5px 1.5px at 40% 60%, rgba(255,255,255,.35), transparent),
      radial-gradient(1.5px 1.5px at 88% 50%, rgba(255,255,255,.4), transparent),
      radial-gradient(1.5px 1.5px at 25% 80%, rgba(255,255,255,.3), transparent);
  }
  .hero > *{ position:relative; opacity:0; transform:translateY(14px); animation:up .6s ease forwards; }
  .hero .kicker{ animation-delay:.05s; } .hero .l1{ animation-delay:.15s; }
  .hero .big{ animation-delay:.25s; } .hero .l2{ animation-delay:.40s; }
  .hero .punch{ animation-delay:.50s; } .hero .sub{ animation-delay:.62s; }
  .hero .cta{ animation-delay:.74s; }
  @keyframes up{ to{ opacity:1; transform:translateY(0); } }

  .kicker{ font-weight:700; letter-spacing:3px; font-size:12px; color:var(--gold); text-transform:uppercase; margin-bottom:16px; }
  .l1, .l2{ font-weight:600; letter-spacing:2px; font-size:clamp(18px,5.5vw,26px); text-transform:uppercase; }
  .l2{ margin-top:6px; color:var(--aqua); }
  .big{
    font-family:"Black Ops One", system-ui; font-size:clamp(120px,42vw,230px);
    line-height:0.82; color:var(--cream);
    text-shadow:5px 5px 0 var(--red), 10px 10px 0 rgba(0,0,0,0.35);
    letter-spacing:4px; margin:2px 0 4px;
  }
  .punch{
    font-family:"Black Ops One", system-ui; font-size:clamp(34px,11vw,60px);
    line-height:0.9; color:var(--gold); text-transform:uppercase; margin-top:6px;
    text-shadow:3px 3px 0 rgba(0,0,0,0.4);
  }
  .sub{ font-size:clamp(15px,4.3vw,19px); font-style:italic; margin:16px auto 22px; max-width:34ch; color:#e9e2d0; }
  .cta{
    display:inline-block; cursor:pointer; border:none; font-family:"Black Ops One", system-ui;
    font-size:clamp(20px,6vw,28px); letter-spacing:1px; color:#fff; background:var(--red);
    padding:15px 38px; border-radius:2px;
    box-shadow:0 6px 0 #7d0f1c, 0 14px 26px rgba(0,0,0,0.4);
    transition:transform .07s ease, box-shadow .07s ease;
  }
  .cta:active{ transform:translateY(5px); box-shadow:0 1px 0 #7d0f1c, 0 6px 14px rgba(0,0,0,0.4); }

  /* countdown */
  .countdown{
    background:var(--navy); border-top:3px solid var(--gold);
    padding:16px 14px; text-align:center;
  }
  .countdown .clab{ font-weight:700; letter-spacing:3px; font-size:12px; color:var(--gold); text-transform:uppercase; margin-bottom:10px; }
  .clocks{ display:flex; justify-content:center; gap:10px; }
  .unit{ background:var(--navy2); border:2px solid var(--navy3); border-radius:4px; padding:8px 4px; min-width:62px; }
  .unit .num{ font-family:"Black Ops One", system-ui; font-size:clamp(24px,7vw,32px); color:var(--cream); line-height:1; }
  .unit .ulab{ font-size:10px; letter-spacing:1px; color:var(--aqua); text-transform:uppercase; margin-top:4px; }
  .countdown.fired .clab{ color:var(--red); font-size:16px; }

  /* facts */
  .facts{ display:grid; gap:1px; background:var(--gold); border-top:3px solid var(--gold); border-bottom:3px solid var(--gold); }
  .fact{ background:var(--navy); padding:14px 18px; display:flex; align-items:center; gap:13px; }
  .fact .ic{ font-size:26px; flex-shrink:0; }
  .fact .lab{ font-weight:700; letter-spacing:1.5px; font-size:12px; color:var(--gold); text-transform:uppercase; }
  .fact .val{ font-size:14.5px; color:var(--cream); line-height:1.25; }

  /* rsvp card */
  .rsvp{ background:var(--cream); color:var(--ink); padding:30px 22px 34px;
    background-image:radial-gradient(rgba(0,0,0,0.04) 1px, transparent 1px); background-size:5px 5px; }
  .rsvp h2{ font-family:"Black Ops One", system-ui; font-size:clamp(30px,8.5vw,44px); line-height:0.92; text-align:center; color:var(--navy); letter-spacing:0.5px; }
  .rsvp .rsub{ text-align:center; font-size:14.5px; font-style:italic; margin:8px auto 22px; max-width:38ch; color:#5a5345; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-weight:700; text-transform:uppercase; letter-spacing:1px; font-size:12px; margin-bottom:6px; color:var(--navy); }
  .field input, .field textarea{ width:100%; font-family:"Oswald", sans-serif; font-size:16px; padding:12px 13px; color:var(--ink); background:#fff; border:2px solid var(--navy); border-radius:3px; }
  .field input:focus, .field textarea:focus{ outline:none; border-color:var(--red); }
  .field textarea{ resize:vertical; min-height:52px; }
  .toggle{ display:flex; gap:10px; }
  .toggle button{ flex:1; cursor:pointer; font-family:"Oswald",sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:1px; font-size:15px; padding:13px 6px; border:2px solid var(--navy); border-radius:3px; background:#fff; color:var(--navy); transition:transform .05s ease; }
  .toggle button:active{ transform:translateY(2px); }
  .toggle button.on-yes{ background:var(--red); color:#fff; border-color:var(--red); }
  .toggle button.on-no{ background:var(--navy); color:var(--cream); }
  .submit{ width:100%; cursor:pointer; margin-top:6px; border:none; font-family:"Black Ops One", system-ui; font-size:clamp(22px,6.5vw,30px); letter-spacing:1px; color:#fff; background:var(--navy); padding:16px; border-radius:3px; box-shadow:0 5px 0 #061029; transition:transform .07s ease, box-shadow .07s ease; }
  .submit:active{ transform:translateY(4px); box-shadow:0 1px 0 #061029; }
  .err{ color:var(--red); font-weight:600; text-align:center; margin-top:12px; min-height:16px; font-size:14px; }
  .success{ display:none; text-align:center; padding:14px 6px; }
  .success.show{ display:block; animation:pop .45s ease; }
  @keyframes pop{ from{ transform:scale(.8); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .badge{ display:inline-block; font-family:"Black Ops One", system-ui; font-size:clamp(26px,8vw,40px); color:#fff; background:var(--red); padding:10px 26px; border-radius:3px; transform:rotate(-3deg); box-shadow:0 6px 0 #7d0f1c; margin-bottom:18px; letter-spacing:1px; }
  .success h3{ font-family:"Black Ops One",system-ui; color:var(--navy); font-size:clamp(20px,6vw,28px); line-height:1; margin-bottom:10px; }
  .success p{ font-size:15px; font-style:italic; color:#5a5345; max-width:36ch; margin:0 auto; }

  /* ---------- ROSTER ---------- */
  .roster{
    background:var(--navy); padding:30px 22px 34px; border-top:3px solid var(--gold);
    background-image: radial-gradient(circle at 50% 50%, rgba(237,183,58,0.12), transparent 60%);
  }
  .roster h2{ font-family:"Black Ops One", system-ui; font-size:clamp(28px,8vw,40px); line-height:0.92; text-align:center; color:var(--cream); letter-spacing:0.5px; }
  .roster .rstsub{ text-align:center; font-size:14px; font-style:italic; color:var(--aqua); margin:8px auto 20px; max-width:36ch; }
  .roster .count{ text-align:center; font-family:"Black Ops One",system-ui; font-size:clamp(36px,10vw,52px); color:var(--gold); margin-bottom:16px; }
  .roster-list{ display:flex; flex-direction:column; gap:8px; }
  .roster-item{ background:var(--navy2); border:2px solid var(--navy3); border-radius:4px; padding:10px 14px; animation:bubpop .3s ease; }
  .roster-item .rname{ font-weight:700; font-size:15px; color:var(--cream); text-transform:uppercase; letter-spacing:0.5px; }
  .roster-item .rcostume{ font-size:13px; font-style:italic; color:var(--gold); margin-top:3px; }
  .roster-empty{ text-align:center; color:#7f88a5; font-style:italic; font-size:14px; padding:12px; }

  /* ---------- WALL ---------- */
  .wall{
    background:var(--navy);
    background-image:
      radial-gradient(circle at 85% 8%, rgba(204,31,51,0.18), transparent 40%),
      radial-gradient(circle at 10% 95%, rgba(39,182,201,0.15), transparent 45%);
    padding:32px 22px 36px; border-top:3px solid var(--gold);
  }
  .wall h2{ font-family:"Black Ops One", system-ui; font-size:clamp(28px,8vw,40px); line-height:0.92; text-align:center; color:var(--cream); letter-spacing:0.5px; }
  .wall .wsub{ text-align:center; font-size:14px; font-style:italic; color:var(--aqua); margin:8px auto 22px; max-width:36ch; }
  .poster{ background:var(--navy2); border:2px solid var(--navy3); border-radius:6px; padding:14px; margin-bottom:22px; }
  .poster .row2{ display:flex; gap:10px; }
  .poster input, .poster textarea{ width:100%; font-family:"Oswald",sans-serif; font-size:15px; padding:10px 11px; border:2px solid var(--navy3); border-radius:3px; background:#fff; color:var(--ink); margin-bottom:10px; }
  .poster textarea{ resize:vertical; min-height:46px; }
  .poster input:focus, .poster textarea:focus{ outline:none; border-color:var(--gold); }
  .poster .post{ width:100%; cursor:pointer; border:none; font-family:"Oswald",sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:1.5px; font-size:15px; color:var(--navy); background:var(--gold); padding:12px; border-radius:3px; transition:transform .05s ease; }
  .poster .post:active{ transform:translateY(2px); }
  .werr{ color:#ff9aa6; font-size:13px; text-align:center; min-height:14px; margin-top:2px; }
  .feed{ display:flex; flex-direction:column; gap:12px; }
  .bubble{ background:var(--cream); color:var(--ink); border-radius:4px 14px 14px 14px; padding:12px 14px; position:relative; animation:bubpop .3s ease; }
  @keyframes bubpop{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:translateY(0);} }
  .bubble .who{ font-weight:700; color:var(--red); font-size:13px; letter-spacing:0.5px; text-transform:uppercase; margin-bottom:3px; }
  .bubble .txt{ font-size:15px; line-height:1.35; }

  /* footer */
  .foot{ background:var(--navy); color:#7f88a5; text-align:center; font-size:11px; letter-spacing:0.5px; padding:16px 20px 24px; line-height:1.6; }
</style>
</head>
<body>
  <div class="wrap" id="wrap"><!-- injected --></div>

<script src="data.js"></script>
<script>
(function(){
  "use strict";
  var root = document.getElementById("wrap");
  if(!window.PARTY){
    root.innerHTML = "<p style='padding:24px;font-family:monospace;color:#fff'>data.js did not load. Keep data.js in the SAME folder as index.html, then refresh.</p>";
    return;
  }
  var P = window.PARTY, H = P.hero, R = P.rsvp, W = P.wall;

  function esc(s){
    return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
      .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  var factsHTML = P.facts.map(function(x){
    return '<div class="fact"><span class="ic">'+esc(x.icon)+'</span>'+
      '<div><div class="lab">'+esc(x.label)+'</div>'+
      '<div class="val">'+esc(x.value)+'</div></div></div>';
  }).join("");

  root.innerHTML =
    '<div class="ribbon"><span>'+esc(P.ribbon)+esc(P.ribbon)+'</span></div>'+

    '<div class="hero">'+
      '<div class="kicker">'+esc(H.kicker)+'</div>'+
      '<div class="l1">'+esc(H.line1)+'</div>'+
      '<div class="big">'+esc(H.bigNumber)+'</div>'+
      '<div class="l2">'+esc(H.line2)+'</div>'+
      '<div class="punch">'+esc(H.punch)+'</div>'+
      '<div class="sub">'+esc(H.sub)+'</div>'+
      '<button class="cta" id="cta">'+esc(H.cta)+'</button>'+
    '</div>'+

    '<div class="countdown" id="countdown">'+
      '<div class="clab" id="clab">'+esc(P.countdownLabel)+'</div>'+
      '<div class="clocks" id="clocks">'+
        '<div class="unit"><div class="num" id="cd">--</div><div class="ulab">Days</div></div>'+
        '<div class="unit"><div class="num" id="ch">--</div><div class="ulab">Hrs</div></div>'+
        '<div class="unit"><div class="num" id="cm">--</div><div class="ulab">Min</div></div>'+
        '<div class="unit"><div class="num" id="cs">--</div><div class="ulab">Sec</div></div>'+
      '</div>'+
    '</div>'+

    '<div class="facts">'+factsHTML+'</div>'+

    '<div class="rsvp" id="rsvpZone">'+
      '<h2>'+esc(R.heading)+'</h2>'+
      '<div class="rsub">'+esc(R.sub)+'</div>'+
      '<form id="form" novalidate>'+
        '<div class="field"><label>'+esc(R.nameLabel)+'</label><input type="text" id="fName" placeholder="'+esc(R.namePlaceholder)+'"></div>'+
        '<div class="field"><label>'+esc(R.phoneLabel)+'</label><input type="tel" id="fPhone" placeholder="'+esc(R.phonePlaceholder)+'"></div>'+
        '<div class="field"><label>'+esc(R.comingLabel)+'</label><div class="toggle">'+
            '<button type="button" id="bYes">'+esc(R.comingYes)+'</button>'+
            '<button type="button" id="bNo">'+esc(R.comingNo)+'</button></div></div>'+
        '<div class="field"><label>'+esc(R.headcountLabel)+'</label><input type="text" id="fCount" placeholder="'+esc(R.headcountPlaceholder)+'"></div>'+
        '<div class="field"><label>'+esc(R.bringingLabel)+'</label><input type="text" id="fBring" placeholder="'+esc(R.bringingPlaceholder)+'"></div>'+
        '<div class="field"><label>'+esc(R.costumeLabel)+'</label><textarea id="fCostume" placeholder="'+esc(R.costumePlaceholder)+'"></textarea></div>'+
        '<button type="submit" class="submit">'+esc(R.submit)+'</button>'+
        '<div class="err" id="err"></div>'+
      '</form>'+
      '<div class="success" id="ok"><div class="badge" id="okBadge"></div><h3 id="okHead"></h3><p id="okBody"></p></div>'+
    '</div>'+

    '<div class="roster" id="roster">'+
      '<h2>WHO\u2019S IN</h2>'+
      '<div class="rstsub">Confirmed patriots. Updated live.</div>'+
      '<div class="count" id="rosterCount"></div>'+
      '<div class="roster-list" id="rosterList"><div class="roster-empty">Loading...</div></div>'+
    '</div>'+

    '<div class="wall">'+
      '<h2>'+esc(W.heading)+'</h2>'+
      '<div class="wsub">'+esc(W.sub)+'</div>'+
      '<div class="poster">'+
        '<input type="text" id="wName" placeholder="'+esc(W.namePlaceholder)+'">'+
        '<textarea id="wMsg" placeholder="'+esc(W.msgPlaceholder)+'"></textarea>'+
        '<button type="button" class="post" id="wPost">'+esc(W.postButton)+'</button>'+
        '<div class="werr" id="wErr"></div>'+
      '</div>'+
      '<div class="feed" id="feed"></div>'+
    '</div>'+

    '<div class="foot">'+esc(P.footer)+'</div>';

  /* ---- RSVP behavior ---- */
  var coming = null;
  var bYes = document.getElementById("bYes");
  var bNo  = document.getElementById("bNo");
  bYes.addEventListener("click", function(){ coming=true; bYes.classList.add("on-yes"); bNo.classList.remove("on-no"); });
  bNo.addEventListener("click", function(){ coming=false; bNo.classList.add("on-no"); bYes.classList.remove("on-yes"); });
  document.getElementById("cta").addEventListener("click", function(){
    document.getElementById("rsvpZone").scrollIntoView({behavior:"smooth", block:"start"});
  });
  document.getElementById("form").addEventListener("submit", function(e){
    e.preventDefault();
    var err = document.getElementById("err");
    var name = document.getElementById("fName").value.trim();
    if(!name){ err.textContent = "Need a name, patriot."; return; }
    if(coming === null){ err.textContent = "You coming or not? Tap one."; return; }
    err.textContent = "";
    var payload = { name:name, phone:document.getElementById("fPhone").value.trim(), coming:coming,
      headcount:document.getElementById("fCount").value.trim(),
      bringing:document.getElementById("fBring").value.trim(),
      costume:document.getElementById("fCostume").value.trim() };
    var btn = document.querySelector(".submit");
    var btnText = btn.textContent;
    btn.disabled = true;
    btn.textContent = "SENDING...";
    fetch(P.endpointUrl, { method: "POST", mode: "no-cors", body: JSON.stringify(payload) })
      .then(function(){
        document.getElementById("form").style.display = "none";
        var S = coming ? R.successYes : R.successNo;
        document.getElementById("okBadge").textContent = S.badge;
        document.getElementById("okHead").textContent = S.head;
        document.getElementById("okBody").textContent = S.body;
        var ok = document.getElementById("ok"); ok.classList.add("show");
        ok.scrollIntoView({behavior:"smooth", block:"center"});
      })
      .catch(function(){
        btn.disabled = false;
        btn.textContent = btnText;
        err.textContent = "Something broke. Try again in a sec.";
      });
  });

  /* ---- WALL behavior (FAKE, in-memory only) ---- */
  var messages = (W.seed || []).slice();
  var feed = document.getElementById("feed");
  function renderFeed(){
    feed.innerHTML = messages.map(function(m){
      return '<div class="bubble"><div class="who">'+esc(m.name)+'</div>'+
        '<div class="txt">'+esc(m.text)+'</div></div>';
    }).join("");
  }
  renderFeed();
  document.getElementById("wPost").addEventListener("click", function(){
    var wErr = document.getElementById("wErr");
    var nm = document.getElementById("wName").value.trim();
    var tx = document.getElementById("wMsg").value.trim();
    if(!nm){ wErr.textContent = "Add your name first."; return; }
    if(!tx){ wErr.textContent = "Say something, patriot."; return; }
    wErr.textContent = "";
    messages.unshift({ name:nm, text:tx });   // newest on top
    console.log("Wall post (not saved yet):", {name:nm, text:tx});
    renderFeed();
    document.getElementById("wMsg").value = "";
  });

  /* ---- ROSTER (fetch guest list) ---- */
  fetch(P.endpointUrl)
    .then(function(r){ return r.json(); })
    .then(function(guests){
      var list = document.getElementById("rosterList");
      var count = document.getElementById("rosterCount");
      if(!guests.length){
        list.innerHTML = '<div class="roster-empty">No confirmed patriots yet. Be the first.</div>';
        count.textContent = "0";
        return;
      }
      count.textContent = guests.length;
      list.innerHTML = guests.map(function(g){
        return '<div class="roster-item"><span class="rname">'+esc(g.name)+'</span>'+
          (g.costume ? '<span class="rcostume">'+esc(g.costume)+'</span>' : '')+
          '</div>';
      }).join("");
    })
    .catch(function(){
      document.getElementById("rosterList").innerHTML = '<div class="roster-empty">Couldn\u2019t load the list. Refresh to try again.</div>';
    });

  /* ---- COUNTDOWN (real, client-side) ---- */
  var target = new Date(P.countdownTo).getTime();
  var cd=document.getElementById("cd"), ch=document.getElementById("ch"),
      cm=document.getElementById("cm"), cs=document.getElementById("cs");
  function pad(n){ return (n<10?"0":"")+n; }
  function tick(){
    if(isNaN(target)) return;
    var diff = target - Date.now();
    if(diff <= 0){
      document.getElementById("clocks").style.display="none";
      var box=document.getElementById("countdown"); box.classList.add("fired");
      document.getElementById("clab").textContent = P.countdownDone;
      clearInterval(timer); return;
    }
    var s=Math.floor(diff/1000);
    cd.textContent = Math.floor(s/86400);
    ch.textContent = pad(Math.floor((s%86400)/3600));
    cm.textContent = pad(Math.floor((s%3600)/60));
    cs.textContent = pad(s%60);
  }
  tick();
  var timer = setInterval(tick, 1000);

})();
</script>
</body>
</html>
